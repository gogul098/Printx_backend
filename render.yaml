databases:
  - name: printapp-db
    databaseName: printapp
    user: printapp_user

services:
  - type: redis
    name: printapp-redis
    ipAllowList: [] # only allow internal connections
    
  - type: web
    name: printapp-web
    env: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: printapp-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: printapp-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: printapp-redis
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SHOP_TELEGRAM_CHAT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
        
  - type: worker
    name: printapp-celery
    env: python
    buildCommand: "bash build.sh"
    startCommand: "celery -A core worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: printapp-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: printapp-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: printapp-redis
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SHOP_TELEGRAM_CHAT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
