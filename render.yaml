databases:
  - name: printapp-db
    plan: free
    databaseName: printapp
    user: printapp_user

services:
  - type: redis
    name: printapp-redis
    plan: free
    ipAllowList: [] # only allow internal connections
    
  - type: web
    name: printapp-web
    plan: free
    env: python
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: printapp-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: printapp-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: printapp-redis
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SHOP_TELEGRAM_CHAT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
