<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Web Checkout</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f4f9; }
        button { padding: 15px 30px; font-size: 16px; background-color: #3399cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2b80aa; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Razorpay Web Checkout Demo</h2>
    <button id="rzp-button1">Pay with Razorpay</button>
    <div id="status"></div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        document.getElementById('rzp-button1').onclick = async function(e) {
            e.preventDefault();
            document.getElementById('status').innerText = "Creating order...";

            try {
                // 1. Call your backend to create the order
                // Note: Make sure your Django server is running on localhost:8000
                const orderResponse = await fetch('http://127.0.0.1:8000/api/orders/create/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        claimed_pages: 10,
                        copies: 1,
                        color_mode: 'bw',
                        sides: 'single',
                        binding: 'none'
                    })
                });

                if (!orderResponse.ok) {
                    throw new Error("Failed to create order on backend");
                }

                const orderData = await orderResponse.json();

                // 2. Open Razorpay Checkout modal
                var options = {
                    "key": "rzp_test_TAEZB8LQznRbv6", // NEVER pass key_secret here!
                    "amount": parseInt(orderData.amount * 100).toString(), 
                    "currency": orderData.currency,
                    "name": "PrintX Services",
                    "description": "Document Printing",
                    "order_id": orderData.order_id,
                    "handler": async function (response) {
                        document.getElementById('status').innerText = "Payment captured! Verifying signature...";
                        
                        // 3. Send signature to backend for verification
                        const verifyResponse = await fetch('http://127.0.0.1:8000/api/verify-payment/', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                razorpay_payment_id: response.razorpay_payment_id,
                                razorpay_order_id: response.razorpay_order_id,
                                razorpay_signature: response.razorpay_signature
                            })
                        });

                        const verifyData = await verifyResponse.json();
                        if (verifyResponse.ok && verifyData.status === 'success') {
                            document.getElementById('status').innerText = "Payment verified successfully! ✅";
                            document.getElementById('status').style.color = "green";
                        } else {
                            document.getElementById('status').innerText = "Payment verification failed! ❌";
                            document.getElementById('status').style.color = "red";
                        }
                    },
                    "prefill": {
                        "name": "Test User",
                        "email": "test@example.com",
                        "contact": "9999999999"
                    },
                    "theme": {
                        "color": "#3399cc"
                    }
                };

                var rzp1 = new Razorpay(options);
                rzp1.on('payment.failed', function (response){
                    document.getElementById('status').innerText = "Payment failed: " + response.error.description;
                    document.getElementById('status').style.color = "red";
                });
                
                rzp1.open();
                document.getElementById('status').innerText = "Awaiting payment...";
                
            } catch (err) {
                document.getElementById('status').innerText = "Error: " + err.message;
                document.getElementById('status').style.color = "red";
            }
        }
    </script>
</body>
</html>
